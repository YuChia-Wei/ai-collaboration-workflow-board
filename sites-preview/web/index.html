:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;color:#172238;background:#f3f5fa;--blue:#274df2;--ink:#172238;--muted:#61708a;--line:#e0e5ef}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #93acf8;outline-offset:3px}button{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;color:var(--ink);min-height:42px}button:hover{background:#f0f3fc}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1e3bd3}.subtle{background:none;border-color:transparent;color:var(--muted)}.app{display:grid;grid-template-columns:246px minmax(280px,340px) minmax(0,1fr);min-height:100vh}.rail{background:#142440;color:#edf2ff;padding:32px 24px;display:flex;flex-direction:column;gap:28px}.brand{font-size:21px;font-weight:750;letter-spacing:.02em;display:flex;align-items:center;gap:12px}.mark{width:32px;height:32px;background:#4668ff;border-radius:9px;display:grid;place-items:center;color:#fff}.rail-label{font-size:14px;color:#a9bad7;margin-bottom:9px}.rail nav button{width:100%;text-align:left;background:#243b61;border:none;color:white}.rail-note{margin-top:auto;color:#b8c7e1;font-size:14px;line-height:1.8}.rail-note strong{color:white;display:block;margin-bottom:6px}.stamp{display:inline-flex;align-items:center;gap:7px;background:#20385d;padding:7px 10px;border-radius:6px;color:#c6d7f5;font-size:13px}.list{background:#fff;border-right:1px solid var(--line);padding:30px 22px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:23px}.list-head h1{font-size:20px;margin:0}.count{color:var(--muted);font-size:14px;font-weight:400;margin-left:8px}.search{width:100%;border:1px solid var(--line);background:#f5f7fb;border-radius:9px;padding:12px 13px;margin-bottom:22px;min-width:0}.search:focus{outline:2px solid #a3b7ff}.filterbar{display:flex;gap:6px;margin-bottom:19px}.filterbar button{font-size:14px;padding:7px 10px;min-height:36px}.filterbar button.chosen{color:var(--blue);background:#eef2ff;border-color:#cbd6ff}.item{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;padding:17px 15px;margin:0 0 10px;background:transparent}.item:hover{background:#f6f8ff}.item.selected{background:#edf2ff;border-color:#cbd7fc}.item h2{font-size:16px;margin:0 0 10px;font-weight:650}.item p{font-size:14px;color:var(--muted);line-height:1.55;margin:8px 0 13px}.item-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.progress{height:5px;background:#dfe6f5;border-radius:8px;overflow:hidden;margin:13px 0 10px}.progress i{display:block;background:var(--blue);height:100%}.badge{font-size:13px;padding:4px 8px;display:inline-flex;border-radius:5px;background:#edf1f6;color:#52617b}.badge.active{background:#e7edff;color:#2b4be0}.badge.completed{background:#ddf5eb;color:#22654c}.badge.blocked{background:#fff0d8;color:#946110}.detail{padding:34px clamp(22px,3vw,52px) 55px;min-width:0;max-width:1200px;width:100%}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-bottom:25px}.mobile-back{display:none}.demo-label{font-size:13px;background:#fff6d9;border:1px solid #ecdfad;color:#776026;border-radius:6px;padding:5px 9px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.hero h1{font-size:clamp(25px,2.4vw,33px);line-height:1.3;letter-spacing:-.035em;margin:10px 0 0}.eyebrow{font-size:14px;color:var(--muted)}.goal{font-size:16px;line-height:1.8;max-width:730px;margin:12px 0 25px;color:#53617a}.next{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px;border:1px solid #d1dcff;border-left:4px solid var(--blue);background:#edf2ff;padding:20px 22px;border-radius:12px;margin-bottom:28px}.next-label{font-size:13px;color:#4b63a2;margin-bottom:7px}.next-text{font-size:17px;line-height:1.55;font-weight:600}.next-owner{font-size:14px;color:#627296;margin-top:8px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:27px;overflow-x:auto}.tabs button{white-space:nowrap;padding:13px 0;border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);font-size:15px}.tabs button.on{border-bottom-color:var(--blue);color:var(--blue);font-weight:600}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:19px}.sectionhead h2{font-size:18px;margin:0}.small{font-size:14px;color:var(--muted);line-height:1.7}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.step{display:grid;grid-template-columns:30px 1fr auto;gap:14px;padding:21px 0;border-bottom:1px solid var(--line)}.step:last-child{border:none}.step-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;border:1px solid #cdd6e8;font-size:14px;background:white;color:#8898b0}.step-icon.completed{background:#def4eb;border-color:#9aceb6;color:#287250}.step h3{font-size:16px;margin:1px 0 7px}.step p{font-size:14px;line-height:1.65;color:var(--muted);margin:4px 0}.step-actions button{font-size:14px;padding:7px 10px}.docrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:1px solid var(--line);background:white;border-radius:9px;margin:10px 0;cursor:pointer}.docrow h3{font-size:16px;margin:0 0 6px}.docrow:hover{border-color:#879fff}.document{margin-top:18px}.document .paper{padding:28px;background:white;border:1px solid var(--line);border-radius:10px;line-height:1.8;overflow-wrap:anywhere}.paper h1{font-size:25px}.paper h2{font-size:20px}.paper p{font-size:16px}.paper code{background:#eef1f6;padding:2px 5px;border-radius:4px}.timeline{border-left:2px solid #d8e1f1;margin-left:9px;padding-left:24px}.entry{position:relative;margin-bottom:21px}.entry:before{content:'';position:absolute;left:-31px;top:7px;width:11px;height:11px;border-radius:50%;background:#8ca0c3;border:3px solid #f3f5fa}.entry .body{background:white;border:1px solid var(--line);padding:17px;border-radius:9px;line-height:1.75;margin-top:8px;white-space:pre-wrap}.evidence{padding:19px;border:1px solid var(--line);background:white;border-radius:10px;margin-bottom:13px}.evidence strong{font-size:16px}.evidence p{font-size:14px;color:var(--muted);line-height:1.75;margin:10px 0}.empty{padding:28px;color:var(--muted);line-height:1.8}.advanced{margin-top:35px;font-size:14px;color:var(--muted)}.advanced pre{background:#e9edf5;padding:16px;overflow:auto;max-height:360px;font-size:13px}.notice{padding:14px 17px;background:#fff0e8;color:#8c4326;border:1px solid #edc7b5;border-radius:9px;margin-bottom:20px;font-size:15px;line-height:1.7}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#142440;color:#fff;border-radius:9px;padding:13px 22px;z-index:5;max-width:90vw}.loader{padding:35px;color:var(--muted)}dialog{width:min(620px,calc(100vw - 28px));max-height:90vh;padding:0;border:1px solid var(--line);border-radius:15px;box-shadow:0 24px 85px #12223c44}dialog::backdrop{background:#10244066}dialog header{padding:23px 25px 15px;display:flex;align-items:center;justify-content:space-between}dialog header h2{font-size:20px;margin:0}form{padding:8px 25px 25px}label{display:block;font-size:14px;color:#4d5c74;margin:15px 0 7px}input,textarea,select{border:1px solid #cdd6e4;border-radius:8px;padding:11px 12px;width:100%;background:white;color:var(--ink);font-size:16px}textarea{min-height:100px;line-height:1.6;resize:vertical}textarea.editor{font-family:ui-monospace,monospace;min-height:270px}form footer{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.form-error{color:#a34730;font-size:14px;line-height:1.7;padding-top:13px}.help{font-size:14px;color:var(--muted);line-height:1.65;margin:9px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}body.busy button[type=submit]{opacity:.65}.mobile-brand{display:none}
@media(max-width:1150px){.app{grid-template-columns:205px 295px minmax(0,1fr)}.rail{padding:28px 18px}.detail{padding:28px 24px}.brand{font-size:18px}.next{grid-template-columns:1fr}.next button{justify-self:start}.tabs{gap:19px}}@media(max-width:900px){.app{grid-template-columns:280px minmax(0,1fr)}.rail{display:none}.mobile-brand{display:block;font-size:18px;font-weight:700;margin-bottom:23px}.detail{padding:26px 23px}.hero{flex-wrap:wrap}.hero button{font-size:14px}.tabs{gap:18px}}@media(max-width:650px){.app{display:block}.list{padding:24px 20px;min-height:100vh;border:none}.detail{display:none;padding:20px 20px 40px}.app.show-detail .list{display:none}.app.show-detail .detail{display:block}.mobile-back{display:inline-block;font-size:14px;padding:7px 10px}.topline{margin-bottom:23px}.hero h1{font-size:28px}.hero{gap:14px}.next{padding:18px}.step{grid-template-columns:25px 1fr;gap:11px}.step-actions{grid-column:2}.pair{grid-template-columns:1fr}.tabs{gap:21px;margin-bottom:22px}.panel{padding:16px}.document .paper{padding:20px}.demo-label{font-size:12px}.rail-note{display:block}}@media(prefers-reduced-motion:no-preference){.item,.docrow,button{transition:background .15s,border-color .15s}}
</style></head><body><div class="app" id="app"><aside class="rail"><div class="brand"><span class="mark">≡</span>工作紀錄室</div><div><div class="rail-label">我的空間</div><nav><button type="button" id="allNav">工作流程 <span style="float:right" id="navCount">—</span></button></nav></div><span class="stamp">本人私有</span><div class="rail-note"><strong>AI collaboration framework</strong>原始工作紀錄、步驟與文件。匯入紀錄保留來源版本與狀態，供查閱。</div></aside><section class="list"><div class="mobile-brand">≡ 工作紀錄室</div><div class="list-head"><h1>工作流程<span class="count" id="total"></span></h1><button class="primary" id="createButton" aria-label="建立工作流程">＋ 新增</button></div><input class="search" type="search" id="search" placeholder="搜尋名稱或目標" aria-label="搜尋工作流程"><div class="filterbar" id="filters"><button class="chosen" data-filter="all">全部</button><button data-filter="active">進行中</button><button data-filter="completed">已完成</button></div><div id="items"><div class="loader">正在讀取紀錄…</div></div><p class="small">framework 紀錄保存在此私有網站。<br>來源版本與原始文件可在詳情查閱。</p></section><main class="detail" id="detail"><div class="loader">正在準備工作空間…</div></main></div><dialog id="modal"><header><h2 id="modalTitle"></h2><button class="subtle" id="closeModal" aria-label="關閉">✕</button></header><form id="form"><div id="fields"></div><div id="formError" class="form-error" role="alert"></div><footer><button type="button" id="cancelModal">取消</button><button class="primary" type="submit" id="saveButton">儲存</button></footer></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusName={planned:'尚未開始',active:'進行中',blocked:'有阻礙',completed:'已完成'},names={steps:'步驟',documents:'文件',logs:'日誌',handoff:'交接',evidence:'證據'};
let records=[],selected=null,tab='steps',filter='all',documentId=null,revisionPick=null,formAction=null;
const translations={source_snapshot_readonly:'這是 framework 來源快照；請依原始工作流程接續，不能在此覆寫來源紀錄。',revision_conflict:'這份紀錄剛被另一個視窗更新。已保留你的輸入，請關閉並重新讀取後再儲存。',operation_payload_conflict:'這次操作編號已用於另一份內容，請重新開啟編輯。',signin_required:'請使用你的 ChatGPT 帳號開啟這個私有網站。',storage_unavailable:'暫時無法讀取或儲存，請保留內容後再試。',missing_required_evidence:'完成步驟前，需要填寫結果並選擇至少一項證據。',illegal_transition:'目前狀態無法直接切換到所選狀態。',incomplete_steps:'還有未完成的步驟，請先整理結果與證據。',missing_required_documents:'必要文件尚未齊全，請先補上。',required_document_archive_forbidden:'這份文件仍是必要文件，不能封存。',final_requires_successor:'已定稿文件需以增補、勘誤或後繼版本保存。'};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok){const e=new Error(translations[data.error]||'無法完成操作，請檢查內容後重試。');e.status=r.status;e.code=data.error;throw e}return data}
function notify(text){$('toast').textContent=text;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3000)}
function progress(w){const s=Object.values(w.steps);return [s.filter(x=>x.status==='completed').length,s.length]}
function badge(s){return `<span class="badge ${s}">${statusName[s]||esc(s)}</span>`}
function renderList(){const q=$('search').value.trim().toLowerCase();$('total').textContent=records.length;$('navCount').textContent=records.length;const list=records.filter(w=>(filter==='all'||w.status===filter)&&(!q||(w.title+' '+w.goal+' '+w.id).toLowerCase().includes(q)));$('items').innerHTML=list.map(w=>{const [done,total]=progress(w);return `<button class="item ${selected?.id===w.id?'selected':''}" data-wid="${esc(w.id)}"><h2>${esc(w.title)}</h2>${w.source_status==='unrecorded'?'<span class="badge">來源未記錄狀態</span>':badge(w.status)}<p>${esc(w.goal)}</p><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div><div class="item-meta"><span>${done} / ${total} 步驟</span><span>${w.record_mode==='source_snapshot'?'來源快照':'修訂 '+w.revision}</span></div></button>`}).join('')||'<div class="empty">找不到符合的紀錄。<br>試試其他關鍵字，或建立新的工作流程。</div>';$('items').querySelectorAll('[data-wid]').forEach(b=>b.onclick=()=>choose(b.dataset.wid))}
async function reload(){records=await api('/api/workflows');renderList();if(selected){selected=(await api('/api/workflows/'+encodeURIComponent(selected.id))).workflow;renderDetail()}}
async function choose(id){selected=(await api('/api/workflows/'+encodeURIComponent(id))).workflow;documentId=null;revisionPick=null;renderList();renderDetail();$('app').classList.add('show-detail');if(innerWidth<=650)scrollTo(0,0)}
async function send(type,payload,w=selected,operation_id=crypto.randomUUID()){const result=await api('/api/commands',{type,payload,workflow_id:w.id,expected_revision:w.revision,operation_id});await reload();return result}
function md(text){return esc(text).split('\n').map(line=>line.startsWith('### ')?'<h3>'+line.slice(4)+'</h3>':line.startsWith('## ')?'<h2>'+line.slice(3)+'</h2>':line.startsWith('# ')?'<h1>'+line.slice(2)+'</h1>':'<p>'+line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')+'</p>').join('')}
function date(t){return new Date(t).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function renderDetail(){if(!selected){$('detail').innerHTML='<div class="empty">選擇左側工作流程，或建立一份新紀錄。</div>';return}const w=selected,[done,total]=progress(w);let content='';
if(tab==='steps')content=`<div class="sectionhead"><h2>內部步驟 <span class="small">${done} / ${total} 已完成</span></h2><button data-action="addStep">＋ 新增步驟</button></div><div class="panel">${Object.values(w.steps).map(s=>`<div class="step"><span class="step-icon ${s.status}">${s.status==='completed'?'✓':s.order}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.owner_skill)} · ${esc(s.source_status||statusName[s.status]||s.status)}</p>${s.result?`<p>${esc(s.result)}</p>`:''}${s.evidence_ids.length?`<p>證據：${s.evidence_ids.map(esc).join('、')}</p>`:''}</div><div class="step-actions"><button data-step="${esc(s.id)}">編輯</button></div></div>`).join('')||'<div class="empty">先加入一個可獨立紀錄的步驟。</div>'}</div>`;
if(tab==='documents'){const docs=Object.values(w.documents).sort((a,b)=>a.name.localeCompare(b.name));content=`<div class="sectionhead"><h2>文件與修訂</h2><button data-action="addDoc">＋ 新增文件</button></div>${docs.map(d=>`<button class="docrow" style="width:100%;text-align:left" data-doc="${esc(d.id)}"><div><h3>▤ ${esc(d.name)} ${d.deleted?'<span class="badge">已封存</span>':''}</h3><span class="small">${d.revisions.length} 個修訂${d.required?' · 必要文件':''}</span></div><span class="small">${d.revisions.at(-1).final?'定稿':'草稿'}</span></button>`).join('')||'<div class="empty">尚未建立文件。</div>'}`;if(documentId&&w.documents[documentId]){const d=w.documents[documentId],r=d.revisions[(revisionPick||d.revisions.length)-1];content+=`<div class="document"><div class="sectionhead"><select id="revisionSelect" aria-label="文件修訂" style="width:auto;max-width:55%">${d.revisions.map(x=>`<option value="${x.revision}" ${x.revision===r.revision?'selected':''}>修訂 ${x.revision}${x.final?' · 定稿':''} · ${date(x.created_at)}</option>`).join('')}</select><div>${!d.deleted?'<button data-action="editDoc">修訂</button> <button data-action="renameDoc">改名</button>':''}</div></div><article class="paper">${d.kind==='source_file'&&!/\.md$/i.test(d.name)?'<pre style="white-space:pre-wrap;font-size:14px">'+esc(r.content)+'</pre>':md(r.content)}</article>${d.source_url?'<p class="small"><a href="'+esc(d.source_url)+'" target="_blank" rel="noopener noreferrer">查看固定版本的原始文件</a> · '+esc(d.source_path)+'</p>':''}<p class="small">${d.required?'必要文件保留於此流程；目前不能退役。':'原始修訂保留。'}${!d.required&&!d.deleted?' <button data-action="archiveDoc">封存文件</button>':''}</p></div>`}}
if(tab==='logs')content=`<div class="sectionhead"><h2>工作日誌</h2><button data-action="addLog">＋ 追加日誌</button></div><div class="timeline">${[...w.logs].reverse().map(l=>`<div class="entry"><span class="small">${date(l.at)}</span><div class="body">${esc(l.text)}</div></div>`).join('')||'<div class="empty">還沒有日誌。</div>'}</div>`;
if(tab==='handoff')content=`<div class="sectionhead"><h2>交接紀錄</h2><button data-action="handoff">保存交接</button></div>${[...w.handoffs].reverse().map(h=>`<section class="panel" style="margin-bottom:14px"><span class="small">${date(h.at)} · ${esc(h.next_owner)}</span><h3 style="font-size:18px">${esc(h.next_step)}</h3>${[['blockers','阻礙'],['failures','失敗'],['limitations','限制']].map(([k,label])=>`<p class="small"><strong>${label}</strong><br>${h[k].length?h[k].map(esc).join('<br>'):'無'}</p>`).join('')}</section>`).join('')||'<div class="empty">保存下一步與必要限制，之後就能接續。</div>'}`;
if(tab==='evidence')content=`<div class="sectionhead"><h2>結果與證據</h2><button data-action="addEvidence">＋ 新增證據</button></div>${Object.values(w.evidence).map(e=>`<article class="evidence"><strong>${esc(e.id)}</strong> <span class="badge ${e.outcome==='passed'?'completed':'blocked'}">${e.outcome==='passed'?'通過':e.outcome==='failed'?'失敗':e.outcome==='interrupted'?'中斷':'受阻'}</span><p>${esc(e.result)}</p><div class="small">${esc(e.command)}<br>來源：${esc(e.source_commit)} · ${date(e.observed_at)}</div></article>`).join('')||'<div class="empty">新增檢查命令、結果與必要環境，完成步驟時再關聯。</div>'}<p class="small">此版保存文字證據與步驟關聯；附件上傳尚未提供。</p>`;
$('detail').innerHTML=`<div class="topline"><button class="mobile-back" id="back">‹ 工作流程</button><span>工作流程 / 紀錄</span><span class="demo-label">${w.record_mode==='source_snapshot'?'framework 來源快照':'本人工作紀錄'}</span></div><div class="hero"><div><span class="eyebrow">${w.source_status==='unrecorded'?'<span class="badge">來源未記錄狀態</span>':badge(w.status)}　${w.record_mode==='source_snapshot'?'來源快照':'修訂 '+w.revision}</span><h1>${esc(w.title)}</h1></div><button data-action="editWorkflow">編輯紀錄</button></div><p class="goal">${esc(w.goal)}</p>${w.record_mode==='source_snapshot'?`<p class="small">來源：ai-collaboration-framework · ${esc(w.source.commit.slice(0,12))}<br>目前 Git 版本的工作紀錄；更早的 Git 修訂尚未匯入。原始日誌、交接與結果保留在「文件」。</p>`:''}<div class="next"><div><div class="next-label">接續這份工作</div><div class="next-text">${esc(w.next_step)}</div><div class="next-owner">下一位：${esc(w.next_owner)}</div></div><button data-action="handoff">更新交接</button></div><nav class="tabs" aria-label="紀錄內容">${Object.entries(names).map(([key,label])=>`<button class="${tab===key?'on':''}" data-tab="${key}">${label}</button>`).join('')}</nav><div id="tabContent">${content}</div><details class="advanced"><summary>進階：來源與資料契約</summary><p>匯入紀錄保留目前 Git 版本的原文；來源快照供查閱，不代表外部 Issue／PR 的最新狀態。附件實體仍保留於來源 repo。</p><pre>${esc(JSON.stringify({id:w.id,revision:w.revision,source:w.source,required_documents:w.required_documents},null,2))}</pre></details>`;
if(w.record_mode==='source_snapshot'){$('detail').querySelectorAll('[data-action],[data-step]').forEach(b=>b.remove());}$('back').onclick=()=>{$('app').classList.remove('show-detail');scrollTo(0,0)};$('detail').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderDetail()});$('detail').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('detail').querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>editStep(b.dataset.step));$('detail').querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{documentId=b.dataset.doc;revisionPick=null;renderDetail()});if($('revisionSelect'))$('revisionSelect').onchange=e=>{revisionPick=Number(e.target.value);renderDetail()};}
const field=(name,label,value='',textarea=false)=>`<label for="f-${name}">${label}</label>${textarea?`<textarea id="f-${name}" name="${name}">${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" value="${esc(value)}" required>`}`;
function openForm(title,fields,handler){$('modalTitle').textContent=title;$('fields').innerHTML=fields;$('formError').textContent='';formAction=handler;$('modal').showModal();$('fields').querySelector('input,textarea,select')?.focus()}
function lines(x){return x.split('\n').map(x=>x.trim()).filter(Boolean)}
function action(name){const w=selected,base=w?structuredClone(w):null;const write=(type,payload)=>send(type,payload,base);
if(name==='create')openForm('建立工作流程',field('title','名稱')+field('goal','目標','',true)+field('next','下一步')+field('owner','下一位負責人','本人'),async f=>{const id=crypto.randomUUID();await api('/api/commands',{workflow_id:id,expected_revision:0,operation_id:crypto.randomUUID(),type:'create_workflow',payload:{title:f.title,goal:f.goal,next_step:f.next,next_owner:f.owner}});await reload();await choose(id)});
if(name==='editWorkflow')openForm('編輯工作紀錄',field('title','名稱',w.title)+field('goal','目標',w.goal,true)+`<label for="f-status">狀態</label><select name="status" id="f-status">${[w.status,...({planned:['active'],active:['blocked','completed'],blocked:['active'],completed:[]}[w.status])].map(s=>`<option value="${s}">${statusName[s]}</option>`).join('')}</select>`,f=>write('update_workflow',{title:f.title,goal:f.goal,...(f.status!==w.status?{status:f.status}:{})}));
if(name==='addStep')openForm('新增內部步驟',field('title','步驟名稱')+field('owner','負責人','本人'),f=>write('add_step',{id:crypto.randomUUID(),title:f.title,owner_skill:f.owner}));
if(name==='addLog')openForm('追加工作日誌',field('text','紀錄內容','',true),f=>write('log',{text:f.text}));
if(name==='handoff'){const h=w.handoffs.at(-1)||{blockers:[],failures:[],limitations:[]};openForm('保存交接',field('next','下一步',w.next_step)+field('owner','下一位負責人',w.next_owner)+field('blockers','阻礙（每行一項）',h.blockers.join('\n'),true)+field('failures','失敗（每行一項）',h.failures.join('\n'),true)+field('limitations','限制（每行一項）',h.limitations.join('\n'),true),f=>write('handoff',{next_step:f.next,next_owner:f.owner,blockers:lines(f.blockers),failures:lines(f.failures),limitations:lines(f.limitations)}));}
if(name==='addDoc')openForm('新增 Markdown 文件',field('name','文件名稱')+field('content','內容（Markdown）','',true)+'<label><input style="width:auto" type="checkbox" name="required"> 必要文件</label>',f=>write('document',{action:'create',id:crypto.randomUUID(),name:f.name,content:f.content,required:f.required==='on'}));
if(name==='editDoc'){const d=w.documents[documentId];openForm('保存文件修訂',field('content','完整內容（Markdown）',d.revisions.at(-1).content,true)+'<label for="f-relation">修訂關係</label><select id="f-relation" name="relation"><option value="addendum">增補</option><option value="erratum">勘誤</option><option value="successor">後繼版本</option></select><label><input style="width:auto" type="checkbox" name="final"> 標記為定稿</label><p class="help">會保存新的完整修訂，原文與 hash 仍保留。</p>',f=>write('document',{action:'revise',id:d.id,content:f.content,relation:f.relation,final:f.final==='on'}));}
if(name==='renameDoc')openForm('文件改名',field('name','文件名稱',w.documents[documentId].name),f=>write('document',{action:'rename',id:documentId,name:f.name}));
if(name==='archiveDoc')openForm('封存文件','<p class="help">封存後會保留全部原始修訂與刪除標記。此版不提供取消封存。</p>',()=>write('document',{action:'archive',id:documentId}));
if(name==='addEvidence')openForm('新增文字證據',field('command','檢查命令或方法')+field('result','實際結果','',true)+field('source','來源版本','synthetic-v1')+field('environment','必要環境描述','合成示範')+'<label for="f-outcome">結果</label><select name="outcome" id="f-outcome"><option value="passed">通過</option><option value="failed">失敗</option><option value="interrupted">中斷</option><option value="blocked">受阻</option></select>',f=>write('evidence',{id:'E-'+crypto.randomUUID().slice(0,8),command:f.command,result:f.result,source_commit:f.source,environment:{description:f.environment},outcome:f.outcome}));}
function editStep(id){const w=structuredClone(selected),s=w.steps[id],transitions={planned:['active'],active:['blocked','completed'],blocked:['active'],completed:[]};openForm('更新步驟',`<p class="help">${esc(s.title)}</p><label for="f-status">狀態</label><select name="status" id="f-status">${[s.status,...transitions[s.status]].map(v=>`<option value="${v}">${statusName[v]}</option>`).join('')}</select>`+field('result','結果',s.result||'',true)+`<label for="f-evidence">證據</label><select multiple name="evidence" id="f-evidence">${Object.values(w.evidence).map(e=>`<option value="${esc(e.id)}" ${s.evidence_ids.includes(e.id)?'selected':''}>${esc(e.id)} · ${esc(e.result.slice(0,40))}</option>`).join('')}</select><p class="help">完成步驟需要結果與至少一項既有證據；先到「證據」新增，再回來關聯。</p>`,async f=>{const evidence=[...$('f-evidence').selectedOptions].map(x=>x.value);await send('update_step',{id,result:f.result,evidence_ids:evidence,...(f.status!==s.status?{status:f.status}:{})},w)})}
$('form').onsubmit=async e=>{e.preventDefault();if(document.body.classList.contains('busy'))return;document.body.classList.add('busy');$('saveButton').disabled=true;try{await formAction(Object.fromEntries(new FormData(e.target)));$('modal').close();notify('已儲存，原始紀錄仍保留。')}catch(err){$('formError').textContent=err.message}finally{document.body.classList.remove('busy');$('saveButton').disabled=false}};$('closeModal').onclick=$('cancelModal').onclick=()=>$('modal').close();$('createButton').onclick=()=>action('create');$('search').oninput=renderList;$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('chosen',x===b));renderList()});$('allNav').onclick=()=>{$('app').classList.remove('show-detail');filter='all';renderList()};
(async()=>{try{records=await api('/api/workflows');renderList();if(records.length){await choose(records[0].id);if(innerWidth<=650)$('app').classList.remove('show-detail')}}catch(e){$('items').innerHTML='<div class="notice">'+esc(e.message)+'</div>';$('detail').innerHTML='<div class="empty">紀錄尚未載入。請重新整理後再試。</div>'}})();
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'read_selected_workflow',description:'Read the selected visible workflow and full original document revisions.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>structuredClone(selected)}).catch(()=>{});}catch{}}
</script></body></html>
