<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow 紀錄室 · 本地原型</title>
<style>body{font:16px system-ui;margin:0;background:#eef2f5;color:#192d36}header{background:#193d45;color:white;padding:28px 6vw}main{max-width:1050px;margin:30px auto;padding:0 20px}section{background:white;border-radius:12px;padding:24px;margin:20px 0;box-shadow:0 3px 14px #1231}label{display:inline-block;margin:8px 16px 8px 0}input,select,textarea{font:inherit;padding:9px;border:1px solid #aabec3;border-radius:6px}textarea{box-sizing:border-box;width:100%;min-height:180px;font:14px monospace}button{font:inherit;background:#176b68;color:white;border:0;padding:11px 18px;border-radius:7px;cursor:pointer;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf5f4;padding:16px;border-radius:8px;max-height:600px;overflow:auto}.note{color:#546e77}h2{margin-top:0}#status{font-weight:600}</style>
<header><h1>Workflow 紀錄室</h1><p>獨立本地合成資料原型 · 工作紀錄、文件修訂與交接</p></header><main>
<section><h2>接續工作</h2><label>本地 token <input id="token" type="password" autocomplete="off"></label><label>Namespace <input id="ns" value="demo"></label><label>Workflow ID <input id="wid" value="synthetic-416"></label><p class="note">Token 只保留在本頁記憶體。身份來自服務端 binding；client/session 標籤不是身份證明。</p><button id="load">載入完整 context</button><button id="list">尋找 workflow</button><button id="export">匯出完整資料包</button><p id="status" role="status"></p><pre id="summary">請輸入本地合成 token，載入 workflow。</pre></section>
<section><h2>受控寫入</h2><p class="note">每次操作使用獨立 operation ID 與目前 revision。衝突時重新讀取並人工調整，已接受但回應遺失時使用相同操作查詢／重送。</p><select id="kind"><option value="log">追加日誌</option><option value="handoff">保存交接</option><option value="document">文件建立／修訂／改名／封存</option><option value="add_step">新增內部 step</option><option value="update_step">更新 step</option><option value="update_workflow">更新下一步／狀態</option><option value="evidence">保存證據／合成附件</option><option value="create_workflow">建立 workflow</option></select><label>預期 revision <input id="rev" type="number" value="0" min="0" style="width:80px"></label><label>Operation ID <input id="oid"></label><textarea id="payload"></textarea><button id="send">提交 command</button><button id="query">查詢此 operation</button><button id="fresh">新 operation ID</button><pre id="result">尚未提交</pre></section>
<section><h2>文件與歷史</h2><p class="note">包含全部保留修訂、刪除標記與完整索引；缺少必要文件會明示。接手前核對 source commit／branch。</p><pre id="detail"></pre></section></main>
<script>
const $=id=>document.getElementById(id), session=crypto.randomUUID();let latest;
const examples={log:{text:'合成工作日誌：確認下一步與限制。'},handoff:{next_step:'讀取必要文件並接續 T2',next_owner:'synthetic-reviewer',blockers:[],failures:['合成 timeout 已保留'],limitations:['Sites／真實 agent 尚未驗證']},document:{action:'create',id:'notes-'+Date.now(),name:'工作筆記',kind:'markdown',content:'# 合成筆記\n此文件保存在本地 store。',required:false},add_step:{id:'T-new',title:'新的內部步驟',order:51,owner_skill:'synthetic-implementer'},update_step:{id:'T2',status:'active'},update_workflow:{next_step:'核對完整 context',next_owner:'synthetic-reader'},evidence:{id:'E-new',command:'synthetic check',result:'pass',outcome:'passed',source_commit:'synthetic',environment:{mode:'local synthetic'},blob_base64:'c3ludGhldGljCg=='},create_workflow:{title:'合成工作',goal:'驗證可接續紀錄',authorized_scope:'P1 only, synthetic',source:{repo:'synthetic',commit:'synthetic',branch:'synthetic'},policy_version:'local-v1',template_version:'local-v1',next_step:'建立 step',next_owner:'synthetic-writer'}};
function fresh(){$('oid').value=crypto.randomUUID()}function example(){$('payload').value=JSON.stringify(examples[$('kind').value],null,2)}fresh();example();$('kind').onchange=example;$('fresh').onclick=fresh;
async function req(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d=await r.json();$('status').textContent='HTTP '+r.status; if(!r.ok)throw d;return d}
function query(){return '?namespace='+encodeURIComponent($('ns').value)}async function load(){try{latest=await req('/v1/workflows/'+encodeURIComponent($('wid').value)+'/context'+query());$('rev').value=latest.workflow.revision;$('summary').textContent=JSON.stringify({id:latest.workflow.id,goal:latest.workflow.goal,status:latest.workflow.status,revision:latest.workflow.revision,next_step:latest.workflow.next_step,next_owner:latest.workflow.next_owner,source:latest.workflow.source,missing_required_documents:latest.missing_required_documents},null,2);$('detail').textContent=JSON.stringify(latest,null,2)}catch(e){$('result').textContent=JSON.stringify(e,null,2)}}$('load').onclick=load;
$('list').onclick=async()=>{try{$('summary').textContent=JSON.stringify(await req('/v1/workflows'+query()),null,2)}catch(e){$('result').textContent=JSON.stringify(e)}};
$('send').onclick=async()=>{try{let c={namespace:$('ns').value,workflow_id:$('wid').value,type:$('kind').value,operation_id:$('oid').value,expected_revision:Number($('rev').value),client:'browser-ui',session,payload:JSON.parse($('payload').value)};$('result').textContent=JSON.stringify(await req('/v1/commands',c),null,2);await load()}catch(e){$('result').textContent=JSON.stringify(e,null,2)}};
$('query').onclick=async()=>{try{$('result').textContent=JSON.stringify(await req('/v1/operations/'+encodeURIComponent($('oid').value)+query()),null,2)}catch(e){$('result').textContent=JSON.stringify(e,null,2)}};
$('export').onclick=async()=>{try{const data=await req('/v1/export'+query()), a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='workflow-export.json';a.click();URL.revokeObjectURL(a.href)}catch(e){$('result').textContent=JSON.stringify(e)}};
</script></html>
