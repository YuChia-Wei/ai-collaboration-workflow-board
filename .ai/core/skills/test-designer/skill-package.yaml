operations:
- id: design
  execution: instruction
  inputs:
  - Requirements, specifications, acceptance or explicitly labeled observed behavior
  - Bounded behavior, selected testing conventions and existing authoring authority
  - Optional caller-selected scenario format and output destination
  outputs:
  - Traceable general test designs or formal test specifications with target-selected
    expressions
  - Expected-value sources, data, boundaries, test levels, gaps and bounded implementation
    handoff
  instructions: references/design.md
  implementation_status: implemented
- id: review
  execution: instruction
  inputs:
  - Fixed scenario artifact identity, source behavior and acceptance
  - Applicable target rules, selected testing conventions and requested coverage
  outputs:
  - Read-only test-design or formal-test-specification findings with evidence and
    uncertainty
  - Coverage, independence limits and bounded implementation handoff
  instructions: references/review.md
  implementation_status: implemented
